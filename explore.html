<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kellerstown — Explore</title>
<style>
  :root { --bar:#f4f2ee; --line:rgba(0,0,0,.16); --ink:#1c1c1c; }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#BFBFB5;
            font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  #wrap{display:flex;height:100%}

  #side{width:250px;flex:0 0 250px;background:var(--bar);border-right:1px solid var(--line);
        display:flex;flex-direction:column;z-index:20}
  #side h1{margin:0;padding:14px 14px 10px;font-size:15px;font-weight:600;
           border-bottom:1px solid var(--line)}
  #master{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px}
  #master button{flex:1;padding:7px 0;font:inherit;font-size:13px;cursor:pointer;
                 border:1px solid var(--line);border-radius:6px;background:#fff}
  #master button:hover{background:#eceae6}
  #cats{flex:1;overflow-y:auto;padding:6px 0}
  .cat{display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;user-select:none}
  .cat:hover{background:rgba(0,0,0,.05)}
  .cat input{margin:0;flex:0 0 auto;cursor:pointer}
  .sw{width:13px;height:13px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.3)}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ct{opacity:.5;font-size:12px;font-variant-numeric:tabular-nums}
  .cat.off .nm,.cat.off .ct{opacity:.4}
  #readout{display:none;padding:8px 14px;font:11.5px/1.5 ui-monospace,Menlo,monospace;
           background:#fffbe6;border-bottom:1px solid var(--line);word-break:break-all}
  body.ident #readout{display:block}
  body.ident #stage{cursor:crosshair}
  #foot{padding:9px 14px;border-top:1px solid var(--line);font-size:11.5px;opacity:.6}

  #stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  #stage>svg{position:absolute;top:0;left:0;transform-origin:0 0;
             width:870.618px;height:779px;display:block}
  #zoom{position:absolute;bottom:12px;right:12px;z-index:10;display:flex;gap:6px}
  #zoom button{width:40px;height:40px;font:19px/1 system-ui,sans-serif;cursor:pointer;
               border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.94)}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:15px;opacity:.65}
  #burger{display:none;position:absolute;top:10px;left:10px;z-index:30;width:42px;height:42px;
          font:19px/1 system-ui;cursor:pointer;border:1px solid var(--line);
          border-radius:6px;background:rgba(255,255,255,.94)}

  @media (max-width:720px){
    #burger{display:block}
    #side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);
          transition:transform .2s ease;box-shadow:0 0 24px rgba(0,0,0,.3)}
    body.menu #side{transform:none}
    #side h1{padding-left:60px}
  }
</style>
</head>
<body>
<div id="wrap">
  <aside id="side">
    <h1>Kellerstown</h1>
    <div id="master">
      <button id="all">Show all</button>
      <button id="none">Hide all</button>
    </div>
    <div id="master" style="border-top:0">
      <button id="ident">Identify: off</button>
    </div>
    <div id="readout"></div>
    <div id="cats"></div>
    <div id="foot">drag to pan · scroll to zoom</div>
  </aside>
  <div id="stage">
    <div id="load">Loading map…</div>
    <div id="zoom">
      <button id="out" title="Zoom out">&minus;</button>
      <button id="fit" title="Fit to screen">&#9634;</button>
      <button id="in" title="Zoom in">+</button>
    </div>
  </div>
</div>
<button id="burger" title="Categories">&#9776;</button>

<script>
const SVG_FILE = "kellerstown_locations_of_interest.svg";

// Rename or merge categories here. Key = a fill colour used in the map.
// Two colours given the SAME name merge into one row in the menu.
// Any annotation colour not listed is named after its own label, or lands in
// "Other markers" if it has no label at all - nothing is ever silently dropped.
const CATEGORIES = {
  "#cf302d": "Access points",
  "#e0269a": "Shops & businesses",
  "#d35f5f": "Streets & transit",
  "#ff6600": "Military & state",
  "#808000": "Houses",
  "#5e5eff": "Halls & clubs",
  "#d2a153": "Swing Gang",
  "#f4de80": "Misc.",
  "#ffe680": "Misc.",
  "#2ca02c": "Misc.",
  "#008080": "Misc.",
  "#3b9441": "Misc.",
  "#ffff00": "Misc.",          // Fifth Revelation?
  "#800080": "Misc.",          // was its own "F" category
  "#d8da1e": "Waypoint"        // You are here! (its star is part of the label path)
};

// Final word on individual shapes, when neither colour nor position can decide.
// id -> category. Use the "Identify" button to find an id, then add a line here.

const OVERRIDES = {
  "path21030-3": "Waypoint",
  "rect21020-0-5-4-3": "Shops & businesses",
  "path21030-3-3-1-7": "Access points"
};

const PLAQUE = "#1a1a1a";                     // shared colour of the black label plaques
const BASE = new Set([                        // the map's own palette - never a category
  "#4c4c4c","#66707f","#662c28","#bfbfb5","#e1dbd5",
  "#1a1a1a","#000000","#ffffff"
]);
// Always-on decoration: never toggleable, never listed in the menu.
const PINNED_LAYERS = ["layer1","layer2","layer3"];   // coat of arms + the snake
const PINNED_LABELS = [                                // matched against aria-label
  "You stole my heart",
  "property of swine gang"
];

const stage = document.getElementById('stage');
const catsEl = document.getElementById('cats');
let svg, scale = 1, x = 0, y = 0, base = 1;
const groups = new Map();   // colour -> {name, els:[], labels:[]}

// A colour arrives either as style="...fill:#abc123..." or as fill="#abc123".
// Only an element's OWN fill counts, never an inherited one.
const fillOf = el => {
  const s = el.getAttribute('style') || '';
  const m = s.match(/(?:^|[;\s])fill:\s*(#[0-9a-fA-F]{6})/);
  if (m) return m[1].toLowerCase();
  const a = el.getAttribute('fill');
  return a && /^#[0-9a-fA-F]{6}$/.test(a) ? a.toLowerCase() : null;
};

fetch(SVG_FILE)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(txt => {
    const doc = new DOMParser().parseFromString(txt, "image/svg+xml");
    svg = document.importNode(doc.documentElement, true);
    svg.removeAttribute('width'); svg.removeAttribute('height');
    stage.insertBefore(svg, stage.firstChild);
    document.getElementById('load').remove();
    build();
    fit();
  })
  .catch(e => { document.getElementById('load').textContent = "Could not load map (" + e.message + ")"; });

function build() {
  const pinned = el => {
    if (PINNED_LAYERS.some(id => el.closest('#' + id))) return true;
    const owner = el.closest('[aria-label]');
    if (!owner) return false;
    const t = owner.getAttribute('aria-label').replace(/\s+/g, ' ');
    return PINNED_LABELS.some(p => t.includes(p));
  };
  const byColour = new Map();

  // 1. bucket every own-filled element by its colour
  svg.querySelectorAll('[style*="fill:#"], [fill^="#"]').forEach(el => {
    const f = fillOf(el);
    if (!f || f === PLAQUE || BASE.has(f) || pinned(el)) return;
    if (!byColour.has(f)) byColour.set(f, { els: [], labels: [] });
    const b = byColour.get(f);
    b.els.push(el);
    const al = el.getAttribute('aria-label');
    if (al) b.labels.push(al.replace(/\s+/g, ' ').trim());
  });

  // 2. name every colour that owns labels (or is named explicitly), merging shared names
  for (const [colour, b] of byColour) {
    if (!b.labels.length && !CATEGORIES[colour]) continue;   // decided by proximity below
    const name = CATEGORIES[colour] || (b.labels.length === 1 ? b.labels[0] : "Other");
    if (!groups.has(name)) groups.set(name, { name, colour, els: [], labels: [] });
    const g = groups.get(name);
    g.els.push(...b.els);
    g.labels.push(...b.labels);
    if (b.labels.length && !CATEGORIES[g.colour]) g.colour = colour;
  }

  // 2b. Marks in a colour no label uses - the red stars, for instance - cannot be
  //     grouped by colour, so attach each to the nearest label's category instead.
  //     Runs before any zoom transform, so 1px here == 1 SVG unit.
  const centre = el => { const r = el.getBoundingClientRect();
                         return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const labelEls = [];
  for (const [name, g] of groups)
    g.els.forEach(e => { if (e.getAttribute('aria-label')) labelEls.push({ name, c: centre(e) }); });
  const NEAR = 30;                                   // SVG units; observed matches are 5-19
  const strays = [];
  for (const [colour, b] of byColour) {
    if (b.labels.length || CATEGORIES[colour]) continue;
    for (const el of b.els) {
      const c = centre(el);
      let best = null, bd = Infinity;
      for (const L of labelEls) {
        const d = Math.hypot(L.c.x - c.x, L.c.y - c.y);
        if (d < bd) { bd = d; best = L; }
      }
      if (best && bd <= NEAR) groups.get(best.name).els.push(el);
      else strays.push(el);
    }
  }
  if (strays.length) {
    groups.set("Other markers", { name: "Other markers", colour: "#888",
                                  els: strays, labels: [] });
  }

  // 3. attach each black plaque to whichever label sits on top of it
  const plaques = [...svg.querySelectorAll('rect')]
    .filter(r => ((r.getAttribute('fill') || fillOf(r) || '').toLowerCase() === PLAQUE))
    .map(r => ({ el: r, box: r.getBoundingClientRect() }));

  for (const [, g] of groups) {
    for (const el of [...g.els]) {
      if (!el.getAttribute('aria-label')) continue;
      const b = el.getBoundingClientRect();
      const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
      let best = null;
      for (const pq of plaques) {
        const q = pq.box;
        if (!pq.claimed && cx >= q.left - 2 && cx <= q.right + 2 &&
            cy >= q.top - 2 && cy <= q.bottom + 2) {
          if (!best || q.width * q.height < best.box.width * best.box.height) best = pq;
        }
      }
      if (best) { best.claimed = true; g.els.push(best.el); }
    }
  }

  // 3b. explicit overrides win over both colour and proximity
  for (const [id, cat] of Object.entries(OVERRIDES)) {
    const el = svg.querySelector('#' + CSS.escape(id));
    if (!el) { console.warn('OVERRIDES: no element with id', id); continue; }
    for (const [, g] of groups) {
      const i = g.els.indexOf(el);
      if (i >= 0) g.els.splice(i, 1);
    }
    if (!groups.has(cat)) groups.set(cat, { name: cat, colour: "#888", els: [], labels: [] });
    groups.get(cat).els.push(el);
  }

  // 4. menu: alphabetical, "Other markers" last
  [...groups.values()]
    .sort((a, b) => {
      const catchAll = n => n === "Other markers";        // always last
      if (catchAll(a.name) !== catchAll(b.name)) return catchAll(a.name) ? 1 : -1;
      return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    })
    .forEach(g => {
      const row = document.createElement('label');
      row.className = 'cat';
      row.innerHTML =
        '<input type="checkbox" checked>' +
        '<span class="sw" style="background:' + g.colour + '"></span>' +
        '<span class="nm"></span><span class="ct">' +
        (g.labels.length || g.els.length) + '</span>';
      row.querySelector('.nm').textContent = g.name;
      row.title = g.labels.join('\n') || (g.els.length + ' unlabelled markers');
      row.querySelector('input').addEventListener('change', e => {
        row.classList.toggle('off', !e.target.checked);
        g.els.forEach(el => el.style.display = e.target.checked ? '' : 'none');
      });
      catsEl.appendChild(row);
    });
}

function setAll(on) {
  catsEl.querySelectorAll('input').forEach(i => {
    if (i.checked !== on) { i.checked = on; i.dispatchEvent(new Event('change')); }
  });
}
document.getElementById('all').onclick = () => setAll(true);
document.getElementById('none').onclick = () => setAll(false);
const identBtn = document.getElementById('ident'), readout = document.getElementById('readout');
identBtn.onclick = () => {
  const on = document.body.classList.toggle('ident');
  identBtn.textContent = 'Identify: ' + (on ? 'on' : 'off');
  readout.textContent = on ? 'Click any label, star or shape on the map.' : '';
};
stage.addEventListener('click', e => {
  if (!document.body.classList.contains('ident')) return;
  const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.ownerSVGElement);
  if (!hit) return;
  let cat = '(not in any category)';
  for (const [n, g] of groups) if (g.els.includes(hit)) cat = n;
  const owner = hit.closest('[aria-label]');
  readout.textContent =
    'id: ' + (hit.id || '(none)') +
    '\nfill: ' + getComputedStyle(hit).fill +
    '\ncategory: ' + cat +
    (owner ? '\nlabel: ' + owner.getAttribute('aria-label').replace(/\s+/g, ' ') : '');
});

document.getElementById('burger').onclick = () => document.body.classList.toggle('menu');

/* ---------- pan & zoom ---------- */
const draw = () => { svg.style.transform = `translate(${x}px,${y}px) scale(${scale})`; };

function fit() {
  if (!svg) return;
  const w = 870.618, h = 779;
  base = Math.min(stage.clientWidth / w, stage.clientHeight / h);
  scale = base;
  x = (stage.clientWidth - w * scale) / 2;
  y = (stage.clientHeight - h * scale) / 2;
  draw();
}
function zoomAt(cx, cy, k) {
  const next = Math.min(base * 60, Math.max(base * 0.5, scale * k));
  k = next / scale;
  x = cx - (cx - x) * k; y = cy - (cy - y) * k; scale = next; draw();
}
const center = f => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, f);

window.addEventListener('resize', fit);
document.getElementById('in').onclick = () => center(1.4);
document.getElementById('out').onclick = () => center(1 / 1.4);
document.getElementById('fit').onclick = fit;
stage.addEventListener('dblclick', fit);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

const pts = new Map(); let pinch = null;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; draw(); }
  else if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const r = stage.getBoundingClientRect();
    if (pinch) zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch);
    pinch = d;
  }
});
function release(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (!pts.size) stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
</script>
</body>
</html>
